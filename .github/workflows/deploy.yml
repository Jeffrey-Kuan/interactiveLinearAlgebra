# Build the Ximera course with tex4npm and publish dist/ to S3.
#
# Every push and pull request builds the site. Only pushes to the default
# branch deploy. Set these in the repo's Settings > Secrets and variables > Actions:
#
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: AWS_REGION            e.g. us-east-2
#              S3_BUCKET             e.g. linear-algebra-kuan

name: Build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Full TeX Live, Debian based. Includes pdflatex, latex, tex4ht, t4ht,
    # dvisvgm, makeindex and every CTAN package the ximera class pulls in.
    container:
      image: texlive/texlive:latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tex4npm skips any .tex whose recorded input hashes still match, so
      # restoring the previous dist/ turns a full rebuild into an incremental one.
      # The key always misses and the restore-key always picks the newest entry,
      # which is how you get a rolling cache with actions/cache.
      - name: Restore previous build output
        uses: actions/cache@v4
        with:
          path: dist
          key: tex4npm-dist-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tex4npm-dist-${{ github.ref_name }}-
            tex4npm-dist-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build site
        run: npm run build

      - name: Sanity check
        run: |
          test -s dist/ximera.js
          test -s dist/ximera.css
          echo "HTML pages built: $(find dist -name '*.html' | wc -l)"

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: npx tex4npm deploy "${{ vars.S3_BUCKET }}" --delete

