# Build the Ximera course with tex4npm and publish dist/ to GitHub Pages and S3.
#
# GitHub Pages needs no secrets. It must be switched on once under
# Settings > Pages, with "GitHub Actions" as the source.
#
# Every push and pull request builds the site. Only pushes to the default
# branch deploy. Set these in the repo's Settings > Secrets and variables > Actions:
#
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: AWS_REGION            e.g. us-east-2
#              S3_BUCKET             e.g. linear-algebra-kuan

name: Build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Full TeX Live, Debian based. Includes pdflatex, latex, tex4ht, t4ht,
    # dvisvgm, makeindex and every CTAN package the ximera class pulls in.
    container:
      image: texlive/texlive:latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tex4npm skips any .tex whose recorded input hashes still match, so
      # restoring the previous dist/ turns a full rebuild into an incremental one.
      # The key always misses and the restore-key always picks the newest entry,
      # which is how you get a rolling cache with actions/cache.
      - name: Restore previous build output
        uses: actions/cache@v4
        with:
          path: dist
          # Bump the v-number to force a full rebuild, for example after
          # changing anything that alters the HTML post-processing.
          key: tex4npm-dist-v3-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tex4npm-dist-v3-${{ github.ref_name }}-
            tex4npm-dist-v3-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Workaround for @ximera/answer 2.0.0. Its post-processing step turns
      # \answer{...} inside display math into an input box, but only looks for
      # <div class="mathjax-block">. Current TeX4ht writes display math as
      # <span class="mathjax-block">, so those answers were left as a literal
      # \answer, which MathJax shows in red. Remove this step once the package
      # handles both. The grep makes the build fail loudly if the package
      # changes and the patch no longer applies.
      - name: Patch answer post-processing for span display math
        run: |
          f=node_modules/@ximera/answer/postprocess.js
          sed -i "s/'span.mathjax-inline, div.mathjax-block'/'span.mathjax-inline, div.mathjax-block, span.mathjax-block'/" "$f"
          grep -q "div.mathjax-block, span.mathjax-block" "$f"
          # Record which TeX4ht wrote the wrapper, for comparing with other machines.
          m=$(kpsewhich mathjax-latex-4ht.4ht || true)
          echo "TeX4ht MathJax config: $m"
          if [ -n "$m" ]; then head -3 "$m"; grep -n "mathjax-block" "$m" || true; fi
          tlmgr --version | head -2 || true

      # MathML intent and screen reader support. src/intent.cfg holds a MathJax
      # configuration that defines \xmunits, \xmabs and the two building
      # blocks \MathMLintent and \MathMLarg, switches on MathJax's assistive
      # MathML, and loads answer-a11y.js on every page. ximera.cfg comes from
      # the @ximera/core package, so the lines are inserted into the installed
      # copy, just before \begin{document}. Delete src/intent.cfg to switch
      # all of this off.
      - name: Add MathML intent configuration
        run: |
          f=node_modules/@ximera/core/latex/dist/ximera.cfg
          if [ -f src/intent.cfg ]; then
            awk 'FNR==NR{a[n++]=$0; next} /^\\begin\{document\}/{for(i=0;i<n;i++) print a[i]} {print}' src/intent.cfg "$f" > "$f.new"
            mv "$f.new" "$f"
            grep -q "xmintent" "$f"
          fi

      - name: Build site
        run: npm run build

      # Site-specific CSS. Appending it to the bundled stylesheet puts these
      # rules last, so they override the Ximera defaults.
      - name: Add custom CSS
        run: |
          if [ -f src/custom.css ]; then
            printf '\n/* ---- src/custom.css ---- */\n' >> dist/ximera.css
            cat src/custom.css >> dist/ximera.css
          fi

      # Everything under static/ is copied into the site as it is. It holds
      # answer-a11y.js, which must sit next to ximera.js.
      - name: Add static files
        run: |
          if [ -d static ]; then
            cp -R static/. dist/
            echo "static files added: $(find static -type f | wc -l)"
          fi

      # Report only, never fails the build: a literal \answer can be legitimate,
      # for example inside a verbatim listing.
      - name: Report answer boxes left unconverted
        run: |
          grep -rl --include='*.html' '\\answer' dist > /tmp/unconverted.txt || true
          echo "HTML pages still containing a literal \\answer: $(wc -l < /tmp/unconverted.txt)"
          head -20 /tmp/unconverted.txt

      # Diagnostic for incremental builds. tex4npm rebuilds a page when any
      # file it recorded as a dependency is missing or changed. This counts,
      # across all pages, which kinds of recorded dependencies are already
      # gone right after a build (those force a rebuild every time).
      - name: Report recorded dependencies missing after the build
        run: |
          find dist -name '*.html' | while read -r h; do
            grep -o '<meta name="dependency" content="[^"]*"' "$h" | sed -E 's/.*content="[0-9a-f]+ //; s/"$//'
          done | sort -u > /tmp/deps.txt
          echo "distinct recorded dependencies: $(wc -l < /tmp/deps.txt)"
          while read -r d; do [ -e "src/$d" ] || echo "$d"; done < /tmp/deps.txt > /tmp/missing.txt
          echo "missing after build: $(wc -l < /tmp/missing.txt)"
          echo "missing, by file extension:"
          sed -E 's/.*(\.[A-Za-z0-9]+)$/\1/' /tmp/missing.txt | sort | uniq -c | sort -rn
          echo "present, by file extension:"
          grep -vxFf /tmp/missing.txt /tmp/deps.txt | sed -E 's/.*(\.[A-Za-z0-9]+)$/\1/' | sort | uniq -c | sort -rn

      # The build has no start page. Send visitors of the site's address to
      # the course page.
      - name: Add start page
        run: |
          if [ ! -f dist/index.html ]; then
            printf '%s\n' '<!DOCTYPE html>' '<html lang="en"><head><meta charset="utf-8">' '<title>Linear Algebra</title>' '<meta http-equiv="refresh" content="0; url=LinearAlgebraInteractiveIntro.html">' '</head><body><p><a href="LinearAlgebraInteractiveIntro.html">Linear Algebra</a></p></body></html>' > dist/index.html
          fi

      - name: Sanity check
        run: |
          test -s dist/ximera.js
          test -s dist/ximera.css
          if [ -f src/intent.cfg ]; then test -s dist/answer-a11y.js; fi
          echo "HTML pages built: $(find dist -name '*.html' | wc -l)"

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # No --delete: this bucket also holds other sites in subfolders (for
        # example sandbox/), and --delete without a prefix would remove them.
        # The cost is that pages of activities removed from the course stay in
        # the bucket until deleted by hand.
        run: npx tex4npm deploy "${{ vars.S3_BUCKET }}"

  pages:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
